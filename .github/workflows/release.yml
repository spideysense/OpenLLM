name: Signed release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run build:renderer && npm run build:household
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-latest
            args: --mac
          - platform: win
            runner: windows-latest
            args: --win
          - platform: linux-x64
            runner: ubuntu-latest
            args: --linux AppImage deb --x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            args: --linux AppImage deb --arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require platform signing credentials
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          test -n "$CSC_LINK" || { echo 'Platform signing certificate is required'; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo 'Certificate password is required'; exit 1; }
      - name: Linux packaging dependencies
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64 fakeroot dpkg
      - run: npm ci
      - run: npm run build:renderer && npm run build:household
      - name: Build platform artifacts
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == linux-* ]]; then
            npx electron-builder $BUILD_ARGS --publish never
          else
            npx electron-builder $BUILD_ARGS --publish never -c.forceCodeSigning=true
          fi
      - name: Verify macOS notarization
        if: matrix.platform == 'mac'
        run: |
          xcrun stapler validate dist/Aspen-mac.dmg
          spctl --assess --type open --context context:primary-signature dist/Aspen-mac.dmg
      - name: Verify Windows Authenticode
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature dist/Aspen-win.exe
          if ($signature.Status -ne 'Valid') { throw 'Windows installer signature is invalid' }
      - name: Stage exact distribution files
        shell: bash
        run: |
          mkdir release-artifacts
          find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' -o -name '*.blockmap' \) -exec cp '{}' release-artifacts/ \;
      - name: Sign build provenance with GitHub OIDC
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
  prepare-release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify every attestation before staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED_COMMIT: ${{ github.sha }}
        run: |
          for file in release-artifacts/*; do
            node scripts/verify-release.cjs "$file" "$REVIEWED_COMMIT"
          done
      - name: Prepare draft release for platform acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED_COMMIT: ${{ github.sha }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          gh release create "v$VERSION" release-artifacts/* --draft --target "$REVIEWED_COMMIT" --title "Aspen v$VERSION" --generate-notes
